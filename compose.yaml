name: coursepress-lab

services:
  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - coursepress

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - coursepress

  wordpress:
    image: wordpress:6.9-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      COURSEPRESS_LOCAL_MAIL_ENABLED: ${COURSEPRESS_LOCAL_MAIL_ENABLED:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes: &wordpress-volumes
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/coursepress-core:/var/www/html/wp-content/plugins/coursepress-core
      - ./wp-content/themes/coursepress-lab:/var/www/html/wp-content/themes/coursepress-lab
    networks:
      - coursepress

  cli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      <<: *wordpress-environment
      HOME: /tmp
      WP_CLI_CONFIG_PATH: /tmp/wp-cli.yml
    volumes: *wordpress-volumes
    configs:
      - source: wp_cli_config
        target: /tmp/wp-cli.yml
    networks:
      - coursepress
    entrypoint: ["wp"]

configs:
  wp_cli_config:
    file: ./scripts/wp-cli.yml

volumes:
  database_data:
  wordpress_data:

networks:
  coursepress:
    driver: bridge
